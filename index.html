<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFC GAME BOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Gugi&display=swap">
<style>
:root{--bg:#0a0a1a;--pn:#16163a;--ink:#f2f2ff;--c:#00f5d4;--p:#ff3cac;--y:#ffe14d;--b:#6c7cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 'Gugi','Press Start 2P',sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px)}
.app{max-width:440px;margin:auto;padding:14px}
.scr{display:none;flex-direction:column;gap:14px}
.scr.on{display:flex}
p{margin:0;text-align:center}
h1{font:24px/1.5 'Press Start 2P';color:var(--c);text-shadow:3px 3px 0 var(--p);text-align:center;margin:0}
h2{font:14px/1.5 'Press Start 2P';color:var(--y);margin:0;text-align:center}
small{color:#aab;font-size:12px}
.y{color:var(--y);font-size:20px}
.btn{font:13px 'Press Start 2P','Gugi';padding:18px 10px;border:3px solid #000;border-radius:6px;box-shadow:0 5px 0 #000;color:#0a0a1a;background:var(--c);cursor:pointer;touch-action:manipulation;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn.p{background:var(--p)}.btn.y{background:var(--y)}.btn.b{background:var(--b);color:#fff}.btn.s{padding:12px;font-size:11px}
.blink{animation:bl 1s steps(2) infinite;color:var(--p);text-align:center;font:10px 'Press Start 2P'}
@keyframes bl{50%{opacity:0}}
#mon{width:96px;margin:6px auto;animation:bob 1s steps(2) infinite;cursor:pointer;user-select:none}
@keyframes bob{50%{transform:translateY(-6px)}}
.card{display:flex;align-items:center;gap:10px;background:var(--pn);border:3px solid #000;border-left:8px solid var(--cc);padding:10px;border-radius:6px}
.card .btn{padding:12px 8px;font-size:10px;background:var(--cc)}
.ci{flex:1;display:flex;flex-direction:column}
.ic{font-size:30px;width:44px;text-align:center}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--pn);padding:10px 12px;border-radius:6px;border:2px solid #2a2a5a}
.row span:nth-child(2){flex:1;display:flex;flex-direction:column}
.row b{color:var(--y);font-size:14px}
.lock{opacity:.45}
#hud{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12px}
#hud .btn{padding:8px 12px;font-size:11px}
#tm{color:var(--y);font:11px 'Press Start 2P';min-width:60px;text-align:right}
.sw{position:relative;width:min(100%,calc((100dvh - 250px)*.8333));min-width:240px;margin:auto}
#stage{position:relative;width:100%;aspect-ratio:5/6;border:3px solid var(--c);background:#0d0d26;overflow:hidden;touch-action:none;user-select:none}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:44px 'Press Start 2P';color:var(--y);background:rgba(10,10,26,.8);z-index:2}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.big{width:100%;height:100%;border:0;font:20px/1.6 'Press Start 2P','Gugi';color:#0a0a1a;background:var(--b);touch-action:none;user-select:none;cursor:pointer}
.big.w{background:#c0392b;color:#fff}.big.g{background:#2ecc71}.big.r{background:var(--y)}.big.luck{font-size:16px}
.arena{position:absolute;inset:0}
.tg{position:absolute;border-radius:50%;border:3px solid #fff;padding:0;touch-action:none;background:radial-gradient(circle,#ff3cac 0 25%,#fff 26% 45%,#ff3cac 46%)}
#ctl:empty{display:none}
.c2{display:flex;gap:12px}.c2 .pb{flex:1}
.c4{display:grid;grid-template:64px 64px/repeat(3,1fr);gap:8px;max-width:260px;margin:auto;width:100%}
.c4 [data-k=u]{grid-area:1/2}.c4 [data-k=l]{grid-area:2/1}.c4 [data-k=d]{grid-area:2/2}.c4 [data-k=r]{grid-area:2/3}
.pb{height:64px;font-size:26px;border:3px solid #000;border-radius:8px;background:var(--pn);color:var(--c);box-shadow:0 4px 0 #000;touch-action:none;user-select:none}
.pb:active{background:var(--c);color:#000}
.jb{width:100%;height:72px;font-size:20px}
#rt{font:22px/1.4 'Press Start 2P';text-align:center;color:var(--c);margin:0}#rt.bad{color:var(--p)}
.gr{padding:2px 8px;border-radius:4px;color:#000!important;font:12px 'Press Start 2P'!important}
.BRONZE{background:#cd7f32}.SILVER{background:#cfd8dc}.GOLD{background:#ffd700}.DIAMOND{background:#7df9ff}
#ri{font-size:96px;text-align:center;line-height:1.3}#rn{text-align:center;font:16px 'Press Start 2P','Gugi'}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-200%);background:var(--y);color:#000;border:3px solid #000;padding:10px 14px;border-radius:6px;z-index:20;transition:transform .25s;text-align:center;max-width:90%;font-size:13px}
#toast.on{transform:translate(-50%,0)}#toast small{color:#222}
@keyframes rb{to{filter:hue-rotate(360deg)}}#r3{font-size:11px;text-align:right}#mu{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:8px;z-index:21;width:36px;height:36px;font-size:18px;border:3px solid #000;border-radius:6px;background:var(--y);box-shadow:0 3px 0 #000;padding:0}#hud{padding-right:44px}</style>
</head>
<body>
<div class="app">
<section id="home" class="scr on">
 <div class="blink">▶ NFC TAG OK ◀</div>
 <div id="mon"></div>
 <h1>NFC<br>GAME BOX</h1>
 <p class="y">키링을 태그했습니다!</p>
 <p>지금 바로 미니게임을 시작해보세요!</p>
 <button class="btn" data-go="sel">GAME START</button>
 <button class="btn p" data-go="rnd">RANDOM GAME</button>
 <button class="btn y" data-go="rec">RECORD</button>
 <button class="btn b" data-go="how">HOW TO PLAY</button>
 <p><small id="ver">작은 NFC 키링으로 언제 어디서든 즐기는 미니게임 아케이드</small></p>
</section>
<section id="sel" class="scr">
 <button class="btn s y" data-go="home">◀ MAIN</button>
 <h2>SELECT GAME</h2>
 <div id="cards" class="scr on" style="display:flex"></div>
</section>
<section id="play" class="scr">
 <div id="hud"><button class="btn s y" data-go="sel">◀</button><b id="gn"></b><span>점수 <b id="sc">0</b></span><span id="tm"></span></div>
 <div class="sw"><div id="stage"></div><div id="ov"></div></div>
 <div id="ctl"></div>
</section>
<section id="res" class="scr">
 <h2 id="rt"></h2>
 <div class="row"><span>점수</span><b id="r1"></b></div>
 <div class="row"><span>플레이 시간</span><b id="r2"></b></div>
 <div class="row"><span>상세</span><b id="r3"></b></div>
 <div class="row"><span>최고 기록</span><b id="r4"></b></div>
 <div class="row"><span>등급</span><b id="r5" class="gr"></b></div>
 <button class="btn" id="rr"></button>
 <button class="btn p" data-go="sel">게임 선택으로</button>
 <button class="btn y" data-go="rec">RECORD 보기</button>
 <button class="btn b s" data-go="home">🏠 메인 화면</button>
</section>
<section id="rnd" class="scr">
 <button class="btn s y" data-go="home">◀ MAIN</button>
 <h2>RANDOM GAME</h2>
 <div id="ri">🎲</div><div id="rn">?</div><p id="rd"></p>
 <button class="btn" id="rs" style="visibility:hidden">START</button>
</section>
<section id="rec" class="scr">
 <button class="btn s y" data-go="home">◀ MAIN</button>
 <h2>RECORD</h2><div id="rl" class="scr on" style="display:flex"></div>
 <h2>ACHIEVEMENTS</h2><div id="al" class="scr on" style="display:flex"></div>
</section>
<section id="how" class="scr">
 <button class="btn s y" data-go="home">◀ MAIN</button>
 <h2>HOW TO PLAY</h2><div id="hl" class="scr on" style="display:flex"></div>
</section>
</div>
<div id="toast"></div><button id="mu" aria-label="music">🎵</button>
<script>
const $=s=>document.querySelector(s),cp=(v,a,b)=>Math.max(a,Math.min(b,v));
const G=[
{i:'⚡',n:'반응속도 게임',d:'빠르게 나타나는 목표물을 터치!',rt:'최고 기록',c:'#ffe14d',h:'나타났다 사라지는 목표물을 재빨리 터치! 콤보로 점수 UP'},
{i:'💣',n:'폭탄 피하기',d:'떨어지는 폭탄을 피해라',rt:'최고 생존 시간',c:'#ff3cac',h:'드래그 또는 ◀▶(←→)로 이동! 옆에서도 날아와요'},
{i:'🎯',n:'타겟 맞히기',d:'움직이는 타겟! 💀는 조심!',rt:'최고 점수',c:'#00f5d4',h:'터치로 조준! ⭐보너스, 💀가짜 주의 (30초)'},
{i:'🏃',n:'무한 달리기',d:'점프로 장애물을 넘어라',rt:'최고 점수',c:'#6c7cff',h:'JUMP/화면 터치로 2단 점프, ◀▶로 위치 조절'},
{i:'🍀',n:'랜덤 운빨 게임',d:'룰렛을 돌려 운을 시험!',rt:'최고 결과',c:'#7cfc00',h:'터치로 룰렛 시작, 다시 터치하면 빨리 멈춰요 (6라운드)'},
{i:'🪙',n:'코인 모으기',d:'30초간 코인을 모아라',rt:'최고 점수',c:'#ff9f43',h:'드래그/방향키로 이동! 💰황금, ⚠️💣함정 주의 (30초)'}];
const TH=[[400,800,1400],[200,450,800],[300,600,1000],[300,700,1200],[150,300,500],[250,500,900]];
const AN=['첫 게임 클리어','100점 달성','GOLD 등급 달성','3개의 게임 플레이','모든 게임 플레이','최고 기록 갱신'];
const gd=(s,T)=>s>=T[2]?'DIAMOND':s>=T[1]?'GOLD':s>=T[0]?'SILVER':'BRONZE';
let D={rec:{},pl:{},ac:{}};try{D=Object.assign(D,JSON.parse(localStorage.getItem('ngb')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ngb',JSON.stringify(D))}catch(e){}};
let tok=0,raf=0,gid=0,act=null,K={l:0,r:0,u:0,d:0},q=[],busy=0;
function toast(m){q.push(m);if(!busy)nx()}
function nx(){const m=q.shift(),e=$('#toast');if(!m){busy=0;e.classList.remove('on');return}busy=1;e.innerHTML=m;e.classList.add('on');setTimeout(()=>{e.classList.remove('on');setTimeout(nx,250)},2200)}
function ul(k){if(!D.ac[k]){D.ac[k]=1;toast('🏆 업적 달성!<br><small>'+AN[k]+'</small>')}}
function stop(){cancelAnimationFrame(raf);tok++}
function show(id){document.querySelectorAll('.app>.scr').forEach(e=>e.classList.toggle('on',e.id===id));if(id!=='play')stop();scrollTo(0,0)}
function go(x){x==='rnd'?rnd():(x==='rec'&&rec(),show(x))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)return go(b.dataset.go);const p=e.target.closest('[data-p]');if(p)play(+p.dataset.p)});
$('#cards').innerHTML=G.map((g,i)=>`<div class="card" style="--cc:${g.c}"><div class="ic">${g.i}</div><div class="ci"><b>${g.n}</b><small>${g.d}</small></div><button class="btn" data-p="${i}">START</button></div>`).join('');
$('#hl').innerHTML=G.map(g=>`<div class="row"><span class="ic">${g.i}</span><span>${g.n}<small>${g.h}</small></span></div>`).join('');
function rec(){$('#rl').innerHTML=G.map((g,i)=>`<div class="row"><span class="ic">${g.i}</span><span>${g.n}<small>${g.rt}</small></span><b>${D.rec[i]?D.rec[i].l:'-'}</b></div>`).join('');
$('#al').innerHTML=AN.map((a,i)=>`<div class="row ${D.ac[i]?'':'lock'}"><span class="ic">${D.ac[i]?'🏆':'🔒'}</span><span>${a}</span></div>`).join('')}
/* pixel monster + easter eggs */
const M=['00111100','01111110','11011011','11111111','11111111','01011010','10000001','01000010'];
$('#mon').innerHTML='<svg viewBox="0 0 8 8" shape-rendering="crispEdges">'+M.map((r,y)=>[...r].map((c,x)=>c==='1'?`<rect x="${x}" y="${y}" width="1" height="1" fill="#00f5d4"/>`:'').join('')).join('')+'</svg>';
let mc=0,fc=0;
const sec=m=>toast('SECRET FOUND!<br><small>'+m+'</small>');
$('#mon').onclick=()=>{mc++;$('#mon').style.filter=`hue-rotate(${mc*50}deg)`;if(mc>=7){mc=0;sec('👾 당신은 이미 챔피언!')}};
$('#ver').onclick=()=>{if(++fc>=5){fc=0;sec('🕹️ 키링 속에는 작은 오락실이 산다!')}};
/* random game roulette */
function rnd(){show('rnd');const k=tok,pk=Math.floor(Math.random()*6),b=$('#rs');b.style.visibility='hidden';$('#rd').textContent='';let n=0,i=0;
const dr=j=>{$('#ri').textContent=G[j].i;$('#rn').textContent=G[j].n};
const s=()=>{if(k!==tok)return;if(n<24){i=(i+1)%6;dr(i);n++;setTimeout(s,50+n*n*.5)}else{dr(pk);$('#rd').textContent=G[pk].d;b.onclick=()=>play(pk);b.style.visibility='visible'}};s()}
/* play + countdown + result */
function play(id){gid=id;show('play');K={l:0,r:0,u:0,d:0};act=null;const k=tok;$('#gn').textContent=G[id].i;$('#sc').textContent=0;$('#tm').textContent='';
const st=$('#stage'),ct=$('#ctl');st.innerHTML=ct.innerHTML='';ct.className='';$('#ov').style.display='none';
cd(k,()=>GM[id](st,ct))}
function cd(k,f){let n=3;const o=$('#ov');o.style.display='flex';const t=()=>{if(k!==tok)return;if(n<0){o.style.display='none';f();return}o.textContent=n||'GO!';snd(n?440:880,.12);n--;setTimeout(t,700)};t()}
function loop(u,d){const k=tok;let p=performance.now();const f=n=>{if(k!==tok)return;const dt=Math.min(.05,(n-p)/1e3);p=n;u(dt);d();raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function fin(s,c,tt,l,det){stop();const gr=gd(s,TH[gid]),o=D.rec[gid],nb=!o||s>o.s;if(nb)D.rec[gid]={s,l};D.pl[gid]=1;
$('#rt').textContent=c===true?'CLEAR!':c===false?'GAME OVER':c;$('#rt').className=c===false?'bad':'';
$('#r1').textContent=s;$('#r2').textContent=tt;$('#r3').textContent=(det||'')+(o?' / 최고 대비 '+(s>=o.s?'+':'')+(s-o.s):'')||'-';$('#r4').textContent=D.rec[gid].l+(nb?' ★NEW':'');
const g=$('#r5');g.textContent=gr;g.className='gr '+gr;
const r=$('#rr');r.textContent=gid===4?'다시 운 테스트':'다시 도전하기';r.onclick=()=>play(gid);
show('res');$('#rt').style.animation=(gr==='GOLD'||gr==='DIAMOND')?'rb .8s linear infinite':'';if(gr==='GOLD'||gr==='DIAMOND'){[523,659,784,1046].forEach((f,k)=>setTimeout(()=>snd(f,.15),k*120))}
if(c!==false)ul(0);if(s>=100)ul(1);if(gr==='GOLD'||gr==='DIAMOND')ul(2);const n=Object.keys(D.pl).length;if(n>=3)ul(3);if(n>=6)ul(4);if(o&&s>o.s)ul(5);save()}
/* input */
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'};
addEventListener('keydown',e=>{if(!$('#play').classList.contains('on'))return;const k=KM[e.key];if(k){K[k]=1;e.preventDefault()}if(e.key===' '||e.key==='Enter'){e.preventDefault();act&&act()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)K[k]=0});
function pad(ct,ds){ct.className='c'+ds.length;ds.forEach(([k,t])=>{const b=document.createElement('button');b.className='pb';b.dataset.k=k;b.textContent=t;const on=v=>e=>{e.preventDefault();K[k]=v};b.onpointerdown=on(1);b.onpointerup=on(0);b.onpointerleave=on(0);b.onpointercancel=on(0);ct.append(b)})}
function cv(st){const c=document.createElement('canvas');c.width=300;c.height=360;st.append(c);return c.getContext('2d')}
const cl=x=>{x.fillStyle='#0d0d26';x.fillRect(0,0,300,360)};
const me=(x,X,Y)=>{x.fillStyle='#00f5d4';x.fillRect(X,Y,24,24);x.fillStyle='#0a0a1a';x.fillRect(X+5,Y+7,5,5);x.fillRect(X+14,Y+7,5,5)};
const em=(x,t,X,Y)=>{x.font='22px serif';x.textAlign='center';x.fillText(t,X,Y+8)};
const GM=[];
/* ===== v2: sprite + engine ===== */
let S,cb,mx,B,IT,TL,T,ov,FA,XT,P=[],sh=0,AC;
const rs=()=>{S=cb=mx=T=ov=0;B={x2:0,iv:0,sp:0};IT=[];TL=30;XT='';P=[];sh=0};
const snd=(f,d=.08,t='square')=>{try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};
const pop=(t,X,Y,c='#ffe14d')=>P.push({t,x:X,y:Y,l:.9,c});
const boom=(X,Y,c='#ff9f43')=>{for(let i=0;i<12;i++)P.push({x:X,y:Y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,l:.5,c,p:1})};
const PL={H:'#ff3cac',S:'#ffd5a8',E:'#1a1a2e',X:'#c0392b',M:'#d63031',O:'#00f5d4',A:'#ffd5a8',P:'#6c7cff',K:'#222244'};
const HD=['.HHHHHH.','HHHHHHHH','HSSSSSSH','SSESSESS','SSSSSSSS','.SSMMSS.'];
const BD={i:['..OOOO..','.AOOOOA.','..OOOO..','..PPPP..','..K..K..'],a:['..OOOO..','.AOOOO..','A.OOOOA.','.PP..PP.','KK....KK'],b:['..OOOO..','..OOOOA.','.AOOOO.A','..PPPP..','..KKKK..'],j:['A.OOOO.A','A.OOOO.A','..OOOO..','.PP..PP.','KK....KK'],h:['..OOOO..','A.OOOO.A','..OOOO..','.PP..PP.','.K....K.']};
function spr(x,X,Y,f,ex,fl,al,s=3){const h=HD.slice();if(ex==='h')h[5]='.SMMMMS.';if(ex==='x')h[3]='SSXSSXSS';PL.H=D.sk?'#ffd700':'#ff3cac';x.globalAlpha=al||1;[...h,...BD[f||'i']].forEach((r,j)=>[...r].forEach((c,i)=>{if(c!=='.'){x.fillStyle=PL[c];x.fillRect(X+(fl?7-i:i)*s,Y+j*s,s,s)}}));x.globalAlpha=1}
const emo=(p,e)=>{p.ex=e;p.et=.6};
const fr=p=>p.mv?(Math.floor(p.t*12)%2?'a':'b'):'i';
const hd=(x,p,f)=>{const hurt=p.et>0&&p.ex==='x';p.tr.forEach((q,i)=>spr(x,q[0],q[1],f,'n',p.fl,.1+i*.06));if(B.iv>0&&Math.floor(T*10)%2){x.strokeStyle='#00f5d4';x.lineWidth=2;x.strokeRect(p.x-3,p.y-3,30,39)}spr(x,p.x,p.y,hurt?'h':f,p.et>0?p.ex:'n',p.fl)};
const tick=(p,dt,m)=>{p.t+=dt;p.et-=dt;if(m){p.tr.push([p.x,p.y]);if(p.tr.length>3)p.tr.shift()}else p.tr.shift()};
const pt=(e,c)=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*360/r.height]};

/* ===== BGM: original 8-bit loop ===== */
let bt=0,NB;
const ctx=()=>AC=AC||new(window.AudioContext||webkitAudioContext)();
const NF=n=>261.63*2**(n/12);
const MEL=[[12,16,19,16,24,19,16,19],[21,16,12,16,21,24,21,16],[17,21,24,21,29,24,21,17],[19,23,26,23,31,26,23,19]],RT=[0,-3,-7,-5];
function tone(c,ty,f,t,d,g){const o=c.createOscillator(),v=c.createGain();o.type=ty;o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+d)}
function hat(c,t){if(!NB){NB=c.createBuffer(1,2205,44100);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=c.createBufferSource(),v=c.createGain();s.buffer=NB;v.gain.setValueAtTime(.025,t);v.gain.exponentialRampToValueAtTime(.001,t+.04);s.connect(v);v.connect(c.destination);s.start(t)}
function step(c,n,t){const b=Math.floor(n/8)%4,i=n%8;tone(c,'square',NF(MEL[b][i]),t,.16,.03);if(i%2===0)tone(c,'triangle',NF(RT[b]-12),t,.18,.09);if(i%4===0)tone(c,'sine',110,t,.12,.12);if(i%2===1)hat(c,t);if(n%32>=16&&i%2===1)tone(c,'square',NF(MEL[b][i]-12),t,.08,.012)}
function bgm(){if(bt||D.mu)return;try{const c=ctx();c.resume();let n=0,t=c.currentTime+.1;bt=setInterval(()=>{while(t<c.currentTime+.35){step(c,n++,t);t+=.19}},80)}catch(e){}}
function bstop(){clearInterval(bt);bt=0}
const mb=$('#mu');const mr=()=>mb.textContent=D.mu?'🔇':'🎵';mr();
mb.onclick=e=>{e.stopPropagation();D.mu=D.mu?0:1;save();mr();D.mu?bstop():bgm()};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>bgm()));
